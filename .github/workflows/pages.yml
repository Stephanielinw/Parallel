name: Deploy Parallel to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    # Pin to Playwright WebKit's supported distro (ubuntu-latest is 26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test task-specific generation budgets (offline mocks)
        run: |
          node tests/task-token-budgets.test.cjs
          python3 parallel_src/parallel_ai_date/tests/test_task_token_budgets.py
          node tests/chat-anchor-memory.test.cjs
          node tests/chat-bubble-menu-quote.test.cjs
          node tests/recent-meeting-chat-memory.test.cjs
          node tests/post-meeting-chat-handoff.test.cjs
          node tests/appointment-event-lifecycle.test.cjs
          node tests/scene-transition.test.cjs
          node tests/meeting-location-surveillance.test.cjs
          node tests/meeting-surveillance-authority.test.cjs
          node tests/post-meeting-surveillance-replan.test.cjs
          node tests/live-meeting-scene-location.test.cjs
          python3 parallel_src/parallel_ai_date/tests/test_live_meeting_scene_location.py
          node tests/thread-typing-isolation.test.cjs
          node tests/phone-clock-sleep.test.cjs
          node tests/chat-backlog-recovery.test.cjs
          node tests/chat-photos.test.cjs
          node parallel_src/parallel_ai_date/tests/test_episode_archive.cjs
          node tests/auto-episode-archive.test.cjs
          node tests/meeting-reroll.test.cjs
          node tests/meeting-checkpoints.test.cjs
          node tests/browser-storage-quota-rescue.test.cjs
          node tests/m00-backup-contract.test.cjs
          node tests/m01-contract-index.test.cjs
          node tests/m02-diary-evidence.test.cjs
          node tests/m02-lifecycle.test.cjs
          node tests/m03-readonly-backup-audit.test.cjs
          node tests/m03b-shadow-safety.test.cjs
          node tests/m03c-shadow-guard.test.cjs
          python3 parallel_src/parallel_ai_date/tests/test_meeting_checkpoints.py
          node tests/meeting-edit-refusal.test.cjs
          node tests/preset-mobile-groups.test.cjs
          node tests/meeting-opening-agency.test.cjs
          python3 parallel_src/parallel_ai_date/tests/test_phone_clock_sleep.py
          python3 parallel_src/parallel_ai_date/tests/test_recent_meeting_continuity.py
          python3 -m py_compile parallel_src/parallel_ai_date/server.py
      - name: Run existing regression suites (no real model calls)
        run: |
          npx tsx --test src/utils/protocolCleaner.test.ts src/parallelPortable.test.ts
          node tests/mobile-ui.test.cjs
          node tests/discover-session.test.cjs
          node tests/discover-profiles.test.cjs
          node tests/discover-resume.test.cjs
          node tests/discover-touch-gesture.test.cjs
          node tests/token-usage-panel.test.cjs
          node tests/oauth-wrapped-500.test.cjs
          node tests/meeting-summary-coverage.test.cjs
          node tests/meeting-summary-reliability.test.cjs
          python3 parallel_src/parallel_ai_date/tests/test_meeting_summary_reliability.py
          node tests/meeting-resume-forget.test.cjs
          node parallel_src/parallel_ai_date/tests/test_portable.cjs
          python3 -m unittest parallel_src/parallel_ai_date/tests/test_api.py
      - name: Build
        run: npm run build -- --base=/Parallel/
      - name: Check required browser assets and privacy guard
        run: |
          test -f dist/index.html
          test -f dist/parallel/offline.js
          test -f dist/parallel/app.js
          test -f dist/parallel/style.css
          test -f dist/parallel/chat-photo-user.webp
          test -f dist/parallel/chat-photo-ai.webp
          test -f dist/assets/aistudio/image_0cf832e3.png
          test ! -f public/assets/aistudio/_____685745cf.json
          test ! -f dist/assets/aistudio/_____685745cf.json
          grep -q '/Parallel/' dist/index.html
      # Real WebKit engine (not a claim of testing physical iOS Safari).
      # Pin the runner-only dependency; do not mutate package.json or the lockfile.
      - name: Install WebKit smoke-test tooling
        timeout-minutes: 12
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.57.0
          npx playwright install --with-deps webkit
      - name: Run mobile-size WebKit regression suite
        timeout-minutes: 8
        run: npx playwright test -c playwright.m02.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: m02-webkit-failure-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
