.memory-item.is-disputed{opacity:.72;background:#FAF3EA;border-style:dashed}
.memory-item-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.memory-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--butter);border:1.5px solid var(--ink);color:var(--ink)}
.memory-badge.confirmed_fact{background:var(--mint);color:#22553A}
.memory-badge.direct_experience{background:var(--blush);color:#6B222D}
.memory-badge.daily_summary{background:#E8EEFF;color:#2D4373}
.memory-badge.correction{background:#FFE8C2;color:#7A4B13}
.memory-badge.unresolved{background:#FFD9DF;color:#872634}
.memory-badge.disputed{background:#EAE2D7;color:#6E6259}
.memory-date{font-size:10px;color:var(--muted);margin-left:auto;font-weight:600}
.memory-summary{font-size:12px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.memory-item-actions{display:flex;justify-content:flex-end;gap:6px}
.tiny-btn{padding:4px 9px;font-size:10.5px;border-radius:8px}
.danger-text{color:#B83B4A}
.memory-correct-box{display:flex;gap:7px;margin-top:5px}
.memory-correct-box input{flex:1;min-height:34px;border:1.8px solid var(--ink);border-radius:9px;padding:5px 10px;font-size:11.5px;background:#FFF}
/* Typing indicator, WhatsApp read receipts, and message recall notice */
.typing-header-hint{color:#C96A76!important;font-weight:800!important}
.typing-inline{align-self:flex-start;display:inline-flex;align-items:baseline;gap:2px;padding:3px 6px;margin-top:2px;color:var(--muted);font-size:11.5px;font-weight:750;letter-spacing:.02em}
.typing-prose{display:inline-flex;align-items:baseline;gap:2px}
.typing-ellipsis{display:inline-flex;align-items:baseline;margin-left:1px}
.typing-ellipsis i{font-style:normal;font-weight:900;font-size:14px;line-height:1;color:var(--pink);display:inline-block;padding:0 1px;animation:parallelEllipsisJump 1.15s infinite ease-in-out}
.typing-ellipsis i:nth-child(2){animation-delay:.18s}
.typing-ellipsis i:nth-child(3){animation-delay:.36s}
@keyframes parallelEllipsisJump{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-3.5px);opacity:1}}
.msg-receipt{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:#F5ECE0;color:#7E6A5C;border:1px solid #DECBB4}
.msg-receipt .receipt-ic{display:inline-flex;width:13px;height:13px}
.msg-receipt .receipt-ic svg{width:13px;height:13px}
.msg-receipt.is-read{background:var(--mint);color:#205738;border-color:#8AC4A1}
.recall-notice{align-self:center;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted);background:#F7EFE4;border:1.5px dashed #D8C4AC;padding:4px 12px;border-radius:99px;margin:4px auto}
.recall-notice svg,.recall-ic svg{width:13px;height:13px;flex-shrink:0}
/* Dedicated SillyTavern-style Meeting Novel Stage & Meeting Summary Cards */
.end-meeting-btn{padding:6px 12px!important;min-height:36px;border-radius:12px!important;font-size:11.5px!important;font-weight:800!important;gap:5px!important}
.end-meeting-btn svg{width:15px;height:15px}
.chat-body.meeting-novel-body{padding:10px 2px 12px;background:transparent}
.meeting-novel-stage{flex:0 0 auto;height:auto;display:flex;flex-direction:column;gap:14px;background:#FFFDF8;border:2px solid var(--ink);border-radius:20px;padding:16px 18px 20px;box-shadow:4px 4px 0 #E6D7C3}
.meeting-stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1.8px dashed #DECBB4}
.meeting-loc-pill{display:inline-flex;align-items:center;gap:6px;background:#FFF6E5;border:1.8px solid var(--ink);border-radius:12px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--ink);box-shadow:2px 2px 0 #E6D7C3;flex:1;min-width:210px;max-width:360px}
.meeting-loc-pill svg{width:15px;height:15px;color:#C96A76;flex-shrink:0}
.meeting-loc-input{border:0;background:transparent;font-size:12px;font-weight:750;color:var(--ink);flex:1;min-width:90px;padding:2px 4px;border-bottom:1.5px dashed transparent}
.meeting-loc-input:focus{border-bottom-color:var(--ink);background:#FFFFFF;border-radius:6px}
.meeting-stage-hint{font-size:10.5px;font-weight:700;color:#B56D5B}
.meeting-novel-pages{display:flex;flex-direction:column;gap:14px;flex:0 0 auto}
.novel-turn{padding:16px 18px;border-radius:16px;border:1.8px solid var(--ink);background-color:#FFFDF9;background-image:repeating-linear-gradient(transparent,transparent 29px,#F4E9D8 30px);box-shadow:3px 3px 0 #E6D7C3;position:relative}
.novel-turn.player-turn,.novel-turn.novel-user{background-color:#FFF8EB;background-image:none;border-style:dashed}
.novel-speaker-line,.novel-turn-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-family:system-ui,sans-serif;flex-wrap:wrap}
.novel-speaker-name,.novel-speaker{font-size:11.5px;font-weight:800;color:#B85260;letter-spacing:.3px;background:#FFF3E2;padding:2px 9px;border-radius:99px;border:1.4px solid var(--ink)}
.novel-turn.player-turn .novel-speaker-name,.novel-turn.novel-user .novel-speaker{color:var(--ink);background:var(--butter)}
.novel-turn-meta,.novel-speaker-line .scene-time{font-size:10px;font-weight:700;color:var(--muted);margin-left:auto}
.novel-prose{font-family:'Songti SC','Noto Serif CJK SC',Georgia,serif;font-size:14px;line-height:2.05;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);letter-spacing:.01em}
.novel-prose p{margin:0 0 8px}
.novel-prose p:last-child{margin-bottom:0}
.meeting-empty,.novel-empty-card{padding:28px 18px;text-align:center;color:var(--muted);font-size:12.5px;font-weight:650;border:1.8px dashed #D8C4AC;border-radius:16px;background:#FFFBF3}
/* Compact bubble width for short messages (P3 fix) & inline doodle icons (P2 fix) */
.bubble-row>div{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:100%}
.bubble-row.mine>div{align-items:flex-end}
.bubble{width:fit-content;max-width:100%}
.inline-ic-text{display:inline-flex;align-items:baseline;gap:5px;min-width:0}
.inline-doodle-ic{display:inline-flex;width:14px;height:14px;flex-shrink:0;color:#C96A76;transform:translateY(2px)}
.inline-doodle-ic svg{width:14px;height:14px}
/* Top-left character avatar trigger & Character Hub modal */
.modal{position:relative}
.modal-close{float:none;position:absolute;top:18px;right:18px;z-index:5}
.modal>.kicker:first-of-type,.modal>h2:first-of-type{padding-right:48px;min-height:28px;display:flex;align-items:center}
.chat-avatar-trigger{appearance:none;border:1.8px solid transparent;background:transparent;border-radius:14px;padding:3px 8px 3px 3px;display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left;cursor:pointer;transition:background .14s,border-color .14s,transform .14s}
.chat-avatar-trigger:hover{background:#FFF6E5;border-color:#DECBB4;transform:translateY(-1px)}
.thread-truename-hint{font-size:11.5px;font-weight:650;color:var(--muted);margin-left:2px}
.char-hub-header{display:flex;flex-direction:column;gap:10px;width:100%;margin:10px 0 14px;padding:14px;background:linear-gradient(180deg,#FFF8EB 0%,#FFFDF9 100%);border:2px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 var(--ink)}
.char-hub-top{display:flex;align-items:center;gap:12px;width:100%;min-width:0}
.char-hub-header .mini-avatar,.char-hub-avatar{width:48px;height:48px;border-radius:14px;flex-shrink:0;font-size:18px}
.char-hub-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.char-hub-name-btn{appearance:none;border:0;background:transparent;padding:0;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-width:0;cursor:pointer;text-align:left;color:var(--ink)}
.char-hub-name-text,.char-hub-display-name{font-size:17.5px;font-weight:900;line-height:1.25;color:var(--ink);min-width:0;flex:1;overflow-wrap:break-word;word-break:normal}
.char-hub-edit-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px;background:#FFFFFF;border:1.5px solid var(--ink);color:#5E4C41;box-shadow:1.5px 1.5px 0 #E6D7C3;white-space:nowrap;flex-shrink:0;transition:background .14s,transform .14s}
.char-hub-name-btn:hover .char-hub-edit-pill{background:var(--butter);transform:translateY(-1px)}
.char-hub-edit-pill svg{width:11px;height:11px;flex-shrink:0}
.char-hub-source-line{font-size:11.5px;font-weight:650;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-hub-nick-editor{width:100%;background:#FFFFFF;border:1.8px solid var(--ink);border-radius:13px;padding:10px;display:grid;gap:8px;box-shadow:2px 2px 0 #E6D7C3}
.char-hub-nick-editor input{width:100%;min-width:0;box-sizing:border-box;font-size:13px;padding:8px 11px;border-radius:9px;border:1.6px solid var(--ink);background:#FFFDF9;color:var(--ink)}
.char-hub-nick-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;width:100%}
.char-hub-truename-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11.5px;line-height:1.4;color:#6E5A4C;background:#FAF3E6;border:1.4px solid #DFCBB2;border-radius:10px;padding:6px 10px;width:100%}
.char-hub-truename,.truename-tag{font-weight:700;color:#5A4638;min-width:0;overflow-wrap:anywhere}
.char-hub-truename b,.truename-tag b{font-weight:850;color:var(--ink)}
.truename-status{font-size:10.5px;font-weight:750;color:var(--muted)}
.char-hub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:6px;width:100%}
.char-hub-item{appearance:none;border:2px solid var(--ink);background:#FFFDF9;border-radius:16px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:3px 3px 0 #E6D7C3;transition:transform .14s,background .14s,box-shadow .14s;cursor:pointer;min-width:0}
.char-hub-item:hover:not(:disabled){background:var(--butter);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.char-hub-item.is-placeholder{border-style:dashed;border-color:#CBB499;background:#FAF5ED;box-shadow:none;opacity:.68;cursor:default}
.char-hub-ic{width:40px;height:40px;border-radius:13px;background:var(--blush);border:1.8px solid var(--ink);display:grid;place-items:center;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.char-hub-item.is-placeholder .char-hub-ic{background:#FFFDF9;border-style:dashed;box-shadow:none;color:var(--muted)}
.char-hub-ic svg{width:21px;height:21px}
.char-hub-item b{font-size:13px;font-weight:800;color:var(--ink)}
.char-hub-item small{font-size:10.5px;color:var(--muted);line-height:1.35;max-width:100%;overflow-wrap:anywhere}
/* Meeting Summary Card in Chat Timeline */
.meeting-card{align-self:center;width:min(100%,480px);background:linear-gradient(180deg,#FFF8EB 0%,#FFFDF9 100%);border:2px solid var(--ink);border-radius:18px;padding:14px 16px;margin:8px auto;box-shadow:4px 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:9px;transition:transform .14s,box-shadow .14s;text-align:left}
.meeting-card:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);background:#FFF6E5}
.meeting-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meeting-card-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--blush);border:1.5px solid var(--ink);color:var(--ink)}
.meeting-card-badge svg{width:13px;height:13px}
.meeting-card-time,.meeting-card-count{font-size:10.5px;font-weight:700;color:var(--muted)}
.meeting-card-rows{display:grid;gap:6px;background:#FFFFFF;border:1.5px dashed #D8C4AC;border-radius:13px;padding:10px 12px}
.meeting-card-row{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.55;color:var(--ink)}
.meeting-card-row b{font-size:11px;font-weight:800;color:#857063;flex-shrink:0;min-width:52px}
.meeting-card-row.is-summary span{color:#5E4C41}
.meeting-card-loc{font-size:12px;color:var(--ink);line-height:1.4}
.meeting-card-summary{font-size:12px;color:#5E4C41;line-height:1.6;background:#FFFFFF;border:1.5px dashed #D8C4AC;border-radius:12px;padding:8px 11px}
.meeting-card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:750;color:var(--muted);padding-top:2px}
.meeting-card-cta{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:#B85260;white-space:nowrap}
.meeting-card-cta svg,.meeting-card-foot svg{width:14px;height:14px;flex-shrink:0}
/* Meeting Record Modal & Daily Chat Modal */
.meeting-modal-meta{display:flex;flex-wrap:wrap;gap:14px;background:#FFF8EB;border:1.8px solid var(--ink);border-radius:13px;padding:10px 14px;margin:10px 0;font-size:12px}
.meeting-modal-transcript,.daily-modal-messages{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;margin-top:10px}
.meeting-modal-turn{padding:13px 15px;border-radius:14px;border:1.8px solid #D8C4AC;background:#FFFDF9}
.meeting-modal-turn.is-mine{background:#FFF8EB;border-style:dashed}
.meeting-modal-speaker{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px;color:#B85260}
.meeting-modal-prose{font-family:'Songti SC','Noto Serif CJK SC',Georgia,serif;font-size:13.5px;line-height:1.95;white-space:pre-wrap;color:var(--ink)}
.daily-modal-msg{padding:10px 13px;border-radius:13px;border:1.6px solid #D8C4AC;background:#FFFFFF;display:grid;gap:4px}
.daily-modal-msg.is-mine{background:#FFF8EB}
.daily-modal-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.daily-modal-text{font-size:12.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
.memory-cat-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.memory-badge.meeting_summary{background:var(--blush);color:#6B222D}
.memory-badge.daily-summary,.memory-badge.daily_summary{background:#E8EEFF;color:#2D4373}
/* Fix top-right chat header buttons so #chat-mode-btn-slot never stacks into a triangle */
.chat-header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:nowrap}
#chat-mode-btn-slot{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:nowrap}
/* Fix bottom gap between chat compose bar and mobile bottom navigation */
.chat-queue-status:empty{display:none;min-height:0;margin:0}
.chat-compose{padding:9px 0 0}
@media(max-width:870px){
  .main-view{padding:16px 16px calc(76px + env(safe-area-inset-bottom,0px))}
  .messages-layout{height:calc(100dvh - 178px);min-height:360px}
  .mobile-nav{justify-content:center;gap:10px;padding:6px 10px}
  .mobile-nav button{flex:1 1 0;max-width:96px;padding:6px 8px}
}
@media(max-width:580px){
  .main-view{padding:12px 14px calc(72px + env(safe-area-inset-bottom,0px))}
  .messages-layout{height:calc(100dvh - 168px);min-height:340px}
  .mobile-nav{left:12px;right:12px;bottom:max(8px,env(safe-area-inset-bottom,8px));gap:8px;padding:6px 8px}
  .mobile-nav button{flex:1 1 0;max-width:88px;padding:6px 6px}
  .modal-overlay{padding:12px}
  .modal{padding:18px 15px;border-radius:20px;max-height:92dvh}
  .modal-close{top:14px;right:14px;width:34px;height:34px;border-radius:11px}
  .modal>.kicker:first-of-type{padding-right:42px;min-height:26px}
  .char-hub-header{padding:12px;gap:9px;margin:8px 0 12px}
  .char-hub-header .mini-avatar,.char-hub-avatar{width:42px;height:42px;border-radius:13px;font-size:16px}
  .char-hub-name-text,.char-hub-display-name{font-size:16px}
  .char-hub-grid{gap:9px}
  .char-hub-item{padding:11px 8px}
}
/* Real-time Surveillance (实时监控) Modal */
.surv-live-card{background:linear-gradient(180deg,#FFF8EB 0%,#FFFDF9 100%);border:2px solid var(--ink);border-radius:18px;padding:15px 16px;margin:10px 0 14px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:9px}
.surv-live-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.surv-live-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--mint);border:1.5px solid var(--ink);color:#205738}
.surv-live-dot{width:7px;height:7px;border-radius:50%;background:#277A4B;display:inline-block;box-shadow:0 0 0 2px rgba(39,122,75,.2)}
.surv-live-time{font-size:11px;font-weight:800;color:var(--muted)}
.surv-live-loc{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:800;color:var(--ink)}
.surv-live-loc svg{width:18px;height:18px;color:#C96A76;flex-shrink:0}
.surv-live-act{font-size:12.5px;font-weight:750;color:#5E4C41;line-height:1.55}
.surv-live-scene{font-size:12px;line-height:1.7;color:var(--ink);background:#FFFFFF;border:1.5px dashed #D8C4AC;border-radius:13px;padding:10px 12px}
.surv-live-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:2px}
.surv-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.surv-section-head h3{font-size:14px;font-weight:800;margin:0;color:var(--ink)}
.surv-timeline{display:grid;gap:8px;max-height:36vh;overflow-y:auto;padding-right:4px}
.surv-slot{background:#FFFFFF;border:1.8px solid #D8C4AC;border-radius:14px;padding:10px 12px;display:grid;gap:5px}
.surv-slot.is-current{background:#FFF8EB;border-color:var(--ink);box-shadow:3px 3px 0 #E6D7C3}
.surv-slot.is-meeting{border-color:#C96A76;background:#FFF6F7}
.surv-slot-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.surv-slot-time{font-size:11px;font-weight:800;color:var(--ink);background:#F5ECE0;padding:2px 8px;border-radius:99px;border:1.4px solid var(--ink)}
.surv-slot.is-current .surv-slot-time{background:var(--butter)}
.surv-slot-loc{font-size:12px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.surv-slot-loc svg{width:13px;height:13px;color:#C96A76;flex-shrink:0}
.surv-slot-tag{margin-left:auto;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:#FFFDF9;border:1.4px solid #CBB69E;color:var(--muted)}
.surv-slot.is-current .surv-slot-tag{background:var(--mint);border-color:var(--ink);color:#205738}
.surv-slot.is-meeting .surv-slot-tag{background:var(--blush);border-color:var(--ink);color:#6B222D}
.surv-slot-act{font-size:12px;line-height:1.55;color:#5E4C41}
.surv-slot-scene{font-size:11.5px;line-height:1.6;color:#6E5A4C;background:#FFFDF9;border-left:2.5px solid #DECBB4;padding:4px 8px;margin-top:2px;border-radius:0 8px 8px 0}
.surv-locked-note{margin-top:9px;padding:9px 12px;border-radius:12px;background:#FAF5ED;border:1.5px dashed #CBB499;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.surv-locked-note svg{width:15px;height:15px;flex-shrink:0;color:#B56D5B}
.inline-ic-text svg{width:15px;height:15px;flex-shrink:0}
/* Modal Header Bar & Calendar Date Input for Surveillance & Diary */
.modal-head-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.modal-head-titles{min-width:0;flex:1 1 200px}
.modal-head-titles h2{margin:0 0 2px;line-height:1.25}
.modal-head-titles .caption{margin:0}
.modal-head-controls{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0}
.modal-date-picker{display:inline-flex;align-items:center;gap:6px;background:#FFFDF9;border:1.8px solid var(--ink);border-radius:12px;padding:4px 10px;box-shadow:2px 2px 0 #E6D7C3;cursor:pointer;transition:transform .12s ease,background .12s ease;max-width:100%}
.modal-date-picker:hover{background:#FFF8EB;transform:translateY(-1px)}
.modal-date-picker svg{width:15px;height:15px;color:#B85260;flex-shrink:0;pointer-events:none}

/* Character Diary (角色日记) Single-Entry Modal */
.diary-sheet{background:linear-gradient(180deg,#FFFDF9 0%,#FFF9EE 100%);border:2px solid var(--ink);border-radius:20px;padding:18px 20px;margin:10px 0 6px;box-shadow:4px 4px 0 var(--ink);display:flex;flex-direction:column;gap:12px;position:relative}
.diary-sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1.5px dashed #DECBB4}

.diary-date-label svg,.diary-date-pill svg{width:14px;height:14px;color:#B85260}
.diary-meta-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.diary-pill,.diary-meta-tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;background:#FFF8EB;border:1.4px solid var(--ink);color:#5E4C41}
.diary-pill.mood{background:var(--blush);color:#6B222D}
.diary-focus-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:750;padding:4px 10px;border-radius:10px;background:#FAF3E6;border:1.4px solid #DFCBB2;color:#6E5A4C;width:fit-content}
.diary-focus-badge.is-deep-love,.diary-focus-badge.is-deeplove{background:#FFF0F3;border-color:#D98B97;color:#8A2E3B}

.diary-prose{font-family:'Songti SC','Noto Serif CJK SC',Georgia,serif;font-size:13.8px;line-height:1.95;color:#2C221E;display:grid;gap:10px;padding:4px 0;max-height:42vh;overflow-y:auto}

.diary-sheet-foot{padding-top:10px;border-top:1.5px dashed #DECBB4;display:grid;gap:7px}
.diary-foot-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.diary-footprint-chips{display:flex;flex-wrap:wrap;gap:6px}
.diary-footprint-chip,.diary-fp-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:750;padding:3px 9px;border-radius:99px;background:#FFFFFF;border:1.4px solid #D8C4AC;color:#6E5A4C}

@media(max-width:580px){

/* Topbar Account Quick-Switch Dropdown */
.topbar{position:relative;z-index:18;flex-wrap:nowrap}

.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex-shrink:0}
.profile-dropdown-wrap{position:relative;display:inline-flex}

.profile-dropdown-menu{position:absolute;top:calc(100% + 8px);right:0;width:232px;max-width:calc(100vw - 28px);background:#FFFDF9;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:10px;display:none;flex-direction:column;gap:8px;z-index:35}

.main-panel:has(.main-view.is-discover-view),.main-panel:has(.messages-layout){height:calc(100dvh - 44px);max-height:calc(100dvh - 44px)}

/* Hide empty queue status & add WeChat-style + button and feature tray */
.chat-queue-status:empty{display:none;min-height:0;margin:0}
.chat-plus-btn{width:44px;height:44px;flex-shrink:0;border:2px solid var(--ink);border-radius:14px;background:#FFF8EB;color:var(--ink);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;transition:transform .14s ease,background .14s ease,box-shadow .14s ease}
.chat-plus-btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);background:var(--butter)}
.chat-plus-btn svg{width:21px;height:21px;transition:transform .18s ease}
.chat-plus-btn.is-open,.chat-plus-btn.active{background:var(--butter);box-shadow:2px 2px 0 var(--ink)}
.chat-plus-btn.is-open svg,.chat-plus-btn.active svg{transform:rotate(45deg)}
.chat-plus-panel{display:none;margin-top:8px;padding:11px 12px 9px;background:#FFF9EE;border:2px solid var(--ink);border-radius:18px;box-shadow:3px 3px 0 #E6D7C3;flex-shrink:0}

.chat-plus-icon svg{width:21px;height:21px}
.chat-plus-label{font-size:11px;font-weight:800;color:var(--ink);white-space:nowrap;line-height:1.2}

.preset-title-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.preset-role-tag,.preset-group-tag,.preset-state-tag{display:inline-flex;padding:2px 7px;border-radius:7px;font-size:10px;font-weight:800;border:1.4px solid #D5C2AA;background:#FFFDF9;color:var(--ink)}

/* One bounded app viewport. Only content panes may scroll. */
html,body,#root{width:100%;height:100%;min-height:0;margin:0;overflow:hidden;overscroll-behavior:none}
#app.shell{height:100vh;height:100dvh;height:var(--parallel-visible-height,100dvh);min-height:0;max-height:none;overflow:hidden;grid-template-rows:minmax(0,1fr)}
#app .main-panel{height:100%;min-height:0;max-height:100%;min-width:0;overflow:hidden}
#app .sidebar,#app .right-panel{min-height:0;overflow-y:auto;overscroll-behavior:contain}
#app .topbar,#app .chat-header,#app .chat-compose,#app .mobile-nav{flex-shrink:0}
#app #view.main-view{min-height:0;min-width:0;overscroll-behavior:contain;overflow-x:hidden;overflow-y:auto}
#app #view.is-discover-view,#app #view:has(.messages-layout){overflow:hidden}
#app #view .messages-layout{height:100%;min-height:0;max-height:100%;grid-template-rows:minmax(0,1fr)}
#app .threads,#app .chat-view,#app .chat-body{min-height:0;min-width:0}
#app .threads,#app .chat-body,.modal,.syslog-pre,.surv-timeline,.diary-prose,.meeting-modal-transcript,.daily-modal-messages{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#app .chat-body{overflow-y:auto;overflow-x:hidden}
#app .chat-compose textarea{min-width:0}
.thread-unread-badge,.nav-unread-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#D96B78;flex-shrink:0}
.thread-unread-badge{margin-left:7px;vertical-align:middle}
#app [data-tab="messages"]{position:relative}
.nav-unread-dot{position:absolute;right:8px;top:8px;box-shadow:0 0 0 2px #FFFDF9;pointer-events:none}
@media(max-width:870px){
  #app.shell{position:fixed;top:var(--parallel-visible-top,0px);left:0;right:0;padding:0;max-width:760px;margin:0 auto}
  #app .main-panel{height:100%;min-height:0;max-height:none}
  #app #view.main-view{padding-bottom:12px}
  #app .mobile-nav{position:relative;inset:auto;left:auto;right:auto;bottom:auto;margin:0 14px max(10px,env(safe-area-inset-bottom,0px));width:auto}
  input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),textarea,select,[contenteditable="true"]{font-size:16px!important}
  html{-webkit-text-size-adjust:100%}
  .modal{max-height:calc(var(--parallel-visible-height,100dvh) - 32px)}
}
@media(max-width:580px){
  #app .mobile-nav{margin:0 12px max(8px,env(safe-area-inset-bottom,0px))}
  #app #view.main-view{padding-bottom:10px}
}
@media(pointer:coarse){
  input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),textarea,select,[contenteditable="true"]{font-size:16px!important}
}

/* Compact mobile header. Apply the top safe area once (viewport-fit=cover),
   without a second standalone-mode offset or a safe-area-based min-height. */
@media (max-width:870px){
  #app .topbar{
    min-height:0;
    padding:calc(env(safe-area-inset-top,0px) + 6px) 18px 10px;
    gap:8px;
  }
}
@media (max-width:580px){
  #app .topbar{
    padding:calc(env(safe-area-inset-top,0px) + 5px) 16px 9px;
  }
}

/* Explicit model selector: works on iOS without native datalist support. */
.model-picker-trigger[hidden]{display:none!important}
#api-model[readonly],#api-image-model[readonly]{cursor:pointer}
.model-picker-options{display:flex;flex-direction:column;gap:6px;max-height:min(42dvh,340px);overflow:auto;overscroll-behavior:contain;padding:3px}

  async function generateBios(selected,forceRefresh=false){

const TR_MINOR_TOKENS=new Set(['ok','okay','app','wifi','ai','id','ip','vip','bgm','npc','cp','ui','ux','api','vr','ar','pdf','gps','dna','mv','tv','cd','usb','gif','png','jpg','atm','diy','ktv','ceo','hr','pr','qa','pm','am','km','cm','kg','ml','mg','re','re0','re1','re2','re3','re4','re5','re6','re7','re8','mcu','tva','bsaa','stars','ubcs','lol','omg','btw','vs','kfc','bmw','ps5','pc','ios','mac']);
const computeContentVersionClient=text=>{
  if(globalThis.ParallelOffline?.computeContentVersion)return globalThis.ParallelOffline.computeContentVersion(text);
  const normalized=String(text??'').replace(/\r\n?/g,'\n').trim();
  let h1=0x811c9dc5,h2=0x01000193;
  for(let i=0;i<normalized.length;i++){
    const ch=normalized.charCodeAt(i);
    h1^=ch;h1=Math.imul(h1,0x01000193)>>>0;
    h2^=(ch+(i&0xff));h2=Math.imul(h2,0x85ebca6b)>>>0;
  }
  return `v1:${normalized.length}:${h1.toString(16).padStart(8,'0')}${h2.toString(16).padStart(8,'0')}`;
};
const needsChineseTranslationClient=(rawText,ignoreNames=[])=>{
  if(globalThis.ParallelOffline?.needsChineseTranslation)return globalThis.ParallelOffline.needsChineseTranslation(rawText,ignoreNames);
  const stripped=String(rawText??'').replace(/https?:\/\/\S+|www\.\S+/gi,' ').trim();
  if(!stripped)return false;
  if(/[\u3040-\u309f\u30a0-\u30ff\u31f0-\u31ff\uac00-\ud7af\u1100-\u11ff\u0400-\u04ff\u0370-\u03ff\u0600-\u06ff\u0e00-\u0e7f\u0590-\u05ff]/.test(stripped))return true;
  const hanCount=(stripped.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  const latinWords=stripped.match(/[A-Za-z\u00c0-\u024f]+(?:'[A-Za-z\u00c0-\u024f]+)*/g)||[];
  const totalLatin=latinWords.reduce((s,w)=>s+w.length,0);
  if(hanCount===0&&totalLatin===0)return false;
  if(hanCount===0&&totalLatin>0){
    if(latinWords.length===1&&TR_MINOR_TOKENS.has(latinWords[0].toLowerCase()))return false;
    return totalLatin>=2||latinWords.length>1;
  }
  if(hanCount>0&&totalLatin===0)return false;
  const ignored=new Set();
  for(const nm of (ignoreNames||[])){
    for(const part of (String(nm||'').match(/[A-Za-z\u00c0-\u024f]+(?:'[A-Za-z\u00c0-\u024f]+)*/g)||[])){
      if(part.length>=2)ignored.add(part.toLowerCase());
    }
  }
  const sub=latinWords.filter(w=>{const lo=w.toLowerCase();return lo.length>1&&!TR_MINOR_TOKENS.has(lo)&&!ignored.has(lo);});
  const subChars=sub.reduce((s,w)=>s+w.length,0);
  return sub.length>=2||(sub.length===1&&subChars>=7);
};

const READ_CURSOR_KEY='parallel-incoming-read-v1';

function applyInboxSnapshot(pid,threads){
  if(pid!==state.activeId)return false;
  if(!Object.prototype.hasOwnProperty.call(readCursors,pid)){

    readCursors[pid]={};
    for(const t of threads){const m=t.last_incoming;if(isIncoming(m))readCursors[pid][t.character.id]=m.id;}

}

async function scheduleAutoTranslation(profileId,characterId,specificIds=null,force=false){
  if(!profileId||!characterId)return;
  if(!force&&state.settings?.auto_translate===false)return;
  if(state.settings?.mode==='normal')return;
  if(state.activeId!==profileId||state.threadId!==characterId)return;
  const thread=state.threads.find(x=>x.character.id===characterId);
  const c=thread?.character;
  const p=activeProfile();
  const ignoreNames=[c?.name||'',p?.name||'',...(c?.aliases||[])];
  const reqSet=Array.isArray(specificIds)&&specificIds.length?new Set(specificIds):null;
  const toFetch=[];
  for(const m of (state.messages||[])){
    if(!m||m.sender!=='ai'||(m.mode||'chat')!=='chat'||m.recalled||m.engine==='recalled'||m.engine==='error'||m.isolated_error)continue;
    if(m.id==='pending'||m.id==='typing')continue;
    if(reqSet&&!reqSet.has(m.id))continue;
    if(state.translatingIds.has(m.id))continue;
    const orig=cleanBodyText(m.text,'ai');
    if(!needsChineseTranslationClient(orig,ignoreNames))continue;
    const ver=computeContentVersionClient(orig);
    const existing=state.translations[m.id];
    const attemptKey=`${m.id}:${ver}`;
    if(!force){
      if(existing&&existing.content_version===ver&&(existing.status==='ready'||existing.status==='error'))continue;
      if(state.translationAutoAttempted.has(attemptKey))continue;
    }
    toFetch.push({id:m.id,attemptKey});
  }
  if(!toFetch.length)return;
  const batch=toFetch.slice(0,12);
  const batchIds=batch.map(x=>x.id);
  for(const item of batch){
    state.translatingIds.add(item.id);
    state.translationAutoAttempted.add(item.attemptKey);
  }
  if(state.tab==='messages'&&state.activeId===profileId&&state.threadId===characterId)renderMessages();
  try{
    const res=await api('/translate-messages',{profileId,characterId,messageIds:batchIds,force});
    for(const id of batchIds)state.translatingIds.delete(id);
    if(state.activeId===profileId&&state.threadId===characterId){
      if(res&&res.translations&&typeof res.translations==='object'){
        state.translations={...state.translations,...res.translations};
      }
      if(state.tab==='messages')renderMessages();
      if(force&&res&&res.ok===false){
        toast('译文获取失败，原消息已保留，可稍后再次重试');
      }
    }
  }catch(e){
    for(const id of batchIds)state.translatingIds.delete(id);
    if(state.activeId===profileId&&state.threadId===characterId){
      if(state.tab==='messages')renderMessages();
      if(force)toast('译文获取失败：'+(e?.message||'请稍后重试'));
    }
  }
}

          <span class="meeting-card-cta">查看见面记录 ${I('arrow')}</span>
        </div>
      </div>`;
    }
    const m=b.msg;
    if(m.engine==='recalled'||m.recalled){
      return `<div class="recall-notice" data-recalled-id="${esc(m.id)}">${I('refresh','recall-ic')}<span>${m.sender==='user'?'你撤回了一条消息':`${esc(c.name)} 撤回了一条消息`}</span></div>`;
    }
    const isRealMsg=Boolean(m.id&&m.id!=='pending'&&m.id!=='typing');
    const origText=cleanBodyText(m.text,m.sender);
    let translationHtml='';
    let translationActionBtn='';
    if(m.sender==='ai'&&isRealMsg){
      const needsTr=needsChineseTranslationClient(origText,ignoreNames);
      if(needsTr){
        const ver=computeContentVersionClient(origText);
        const rawTr=state.translations?.[m.id]||null;
        const tr=(rawTr&&rawTr.content_version===ver)?rawTr:null;
        const isCollapsed=state.collapsedTranslations.has(m.id);
        const isExpanded=state.expandedTranslations.has(m.id);
        const isLoading=state.translatingIds.has(m.id);
        const shouldShow=!isCollapsed&&(autoTranslateOn||isExpanded);
        if(shouldShow){
          if(isLoading){
            translationHtml=`<div class="bubble-tr-divider" aria-hidden="true"></div><div class="bubble-tr-status" data-testid="bubble-translation-loading">正在翻译…</div>`;
          }else if(tr&&tr.status==='ready'&&tr.translated_text){
            translationHtml=`<div class="bubble-tr-divider" aria-hidden="true"></div><div class="bubble-tr-text" data-testid="bubble-translation">${esc(tr.translated_text)}</div>`;
          }else if(tr&&tr.status==='error'){
            translationHtml=`<div class="bubble-tr-divider" aria-hidden="true"></div><div class="bubble-tr-error" data-testid="bubble-translation-error"><span>译文暂不可用</span><button type="button" class="bubble-tr-retry-btn" data-action="retry-translation" data-id="${esc(m.id)}">重试翻译</button></div>`;
          }
        }
        if(shouldShow&&(isLoading||(tr&&tr.status==='ready'&&tr.translated_text))){
          translationActionBtn=`<button type="button" class="msg-action-btn" data-action="toggle-translation" data-id="${esc(m.id)}" title="隐藏此条译文" aria-label="隐藏此条译文">隐藏译文</button>`;
        }else if(tr&&tr.status==='ready'&&tr.translated_text){
          translationActionBtn=`<button type="button" class="msg-action-btn" data-action="toggle-translation" data-id="${esc(m.id)}" title="展开此条译文" aria-label="展开此条译文">展开译文</button>`;
        }else if(!(shouldShow&&tr&&tr.status==='error')){
          translationActionBtn=`<button type="button" class="msg-action-btn" data-action="retry-translation" data-id="${esc(m.id)}" title="翻译此条消息" aria-label="翻译此条消息">翻译</button>`;
        }
      }
    }
    const editBtn=isRealMsg?`<button type="button" class="msg-action-btn" data-action="edit-message" data-id="${esc(m.id)}" title="编辑此条消息" aria-label="编辑此条消息">编辑</button>`:'';
    const regenBtn=(isRealMsg&&m.id===lastTrailingAiId&&!charTyping)?`<button type="button" class="msg-action-btn" data-action="regenerate-message" data-id="${esc(m.id)}" title="重新生成角色回复" aria-label="重新生成角色回复">重新生成</button>`:'';
    const recallBtn=isRealMsg?`<button type="button" class="msg-del-btn" data-action="delete-message" data-id="${esc(m.id)}" title="撤回此条消息" aria-label="撤回此条消息">撤回</button>`:'';
    let receiptHtml='';
    if(m.sender==='user'){
      const isPending=(m.id==='pending'||(pendingSet.has(m.id)&&!charTyping));
      const isPaused=isPending&&isCurrentThreadPaused();
      if(isPaused){
        receiptHtml=`<span class="msg-receipt is-paused" title="回复已暂停，点击恢复后将一并发送">${I('clock','receipt-ic')}<em>待回复 · 已暂停</em></span>`;
      }else{
        receiptHtml=isPending
          ?`<span class="msg-receipt is-sent" title="已发出">${I('sent','receipt-ic')}<em>已发出</em></span>`
          :`<span class="msg-receipt is-read" title="对方已读">${I('read','receipt-ic')}<em>已读</em></span>`;
      }
    }
    const time=`<span>${fmtTime(m.created_at)}${m.edited_at?' · 已编辑':''}${m.engine==='demo'?' · 演示回复':''}</span>${receiptHtml}${translationActionBtn}${editBtn}${regenBtn}${recallBtn}`;
    return `<div class="bubble-row ${m.sender==='user'?'mine':''}" data-message-id="${esc(m.id||'')}">${m.sender==='ai'?avatar({...c,avatar:c.portrait}):''}<div><div class="bubble ${translationHtml?'is-bilingual':''}"><div class="bubble-orig">${esc(origText)}</div>${translationHtml}</div><div class="chat-time">${time}</div></div></div>`;
  }).join('');

  const typingHtml=charTyping?`<div class="typing-inline" role="status" aria-live="polite"><span class="typing-label">对方正在输入中</span><span class="typing-ellipsis"><i>.</i><i>.</i><i>.</i></span></div>`:'';
  return htmlParts+typingHtml;
}
function renderPausedTaskBanner(){

  const err=ts?.last_error||null;
  const pendingCount=state.chatMode==='chat'
    ?(state.queue?.pendingIds?.length||ts?.pending_ids?.length||0)
    :(ts?.pending_ids?.length||0);
  const bgList=state.bgErrors?Object.values(state.bgErrors):[];
  let bgHtml='';
  if(bgList.length&&!paused){
    const latestBg=bgList[bgList.length-1];
    bgHtml=`<div class="bg-error-inline-bar" data-testid="bg-error-banner">
      <div class="bg-error-inline-text">
        <span class="bg-error-dot"></span>
        <span>后台任务（${esc(latestBg.task_label||latestBg.task_type)}）上次同步未成功（${esc(latestBg.error_code||'API_ERROR')}），已保留原有数据。</span>

  if(!paused)return bgHtml;
  const codeBadge=err?.http_status?`HTTP ${err.http_status}`:(err?.error_code||'PAUSED');

  const pendingHint=pendingCount>0
    ?`已安全保留 ${pendingCount} 条待回复消息；暂停期间发送的新消息将按顺序排入队列，不会自动触发调用。`
    :'当前任务的自动请求已停止；你的历史记录与角色记忆完好无损。';

      <button type="button" class="btn soft tiny-btn" data-action="api-error-show-detail" data-testid="paused-banner-detail-btn">错误详情</button>

function renderMessages(){
  if(state.tab!=='messages')return;
  markDisplayedIncomingRead();
  const selected=state.threads.find(x=>x.character.id===state.threadId);
  const existingInput=$('chat-input');
  const wasFocused=existingInput&&document.activeElement===existingInput;
  const selStart=existingInput?existingInput.selectionStart:null;
  const selEnd=existingInput?existingInput.selectionEnd:null;
  if(existingInput&&state.renderedThreadId){
    state.draftInputs[state.renderedThreadId]=existingInput.value;
  }
  const existingLoc=$('meeting-location-input');
  if(existingLoc&&state.chatMode==='meeting'){
    state.meetingLocation=existingLoc.value.trim()||state.meetingLocation;
  }
  const isBusy=state.chatBusy||state.flushBusy||state.queue?.status==='inflight';
  const charTyping=isCharacterTyping();
  // Surgical update when staying on the same thread so typing in #chat-input is never interrupted
  const layoutEl=document.querySelector('#view .messages-layout');
  const chatBodyEl=$('chat-body');
  if(selected&&layoutEl&&chatBodyEl&&existingInput&&state.renderedThreadId===state.threadId){
    const threadsEl=layoutEl.querySelector('.threads');
    if(threadsEl)threadsEl.innerHTML=renderMessagesListItems();
    const meeting=state.chatMode==='meeting';
    const chatViewEl=layoutEl.querySelector('.chat-view');
    if(chatViewEl)chatViewEl.classList.toggle('meeting-mode',meeting);
    const nameEl=layoutEl.querySelector('.chat-heading-text b');
    if(nameEl){
      nameEl.textContent=displayName(selected.character);
      nameEl.title=displayName(selected.character);
    }
    const subEl=layoutEl.querySelector('.chat-heading small');
    if(subEl){
      const c=selected.character;
      const subText=c.nickname?`原名：${c.name} · ${c.version}`:c.version;
      subEl.className=charTyping?'typing-header-hint':'';
      subEl.textContent=charTyping?'对方正在输入中…':subText;
    }
    const modeSlot=layoutEl.querySelector('#chat-mode-btn-slot');
    if(modeSlot)modeSlot.innerHTML=renderHeaderModeButton(meeting);
    chatBodyEl.className=`chat-body ${meeting?'meeting-novel-body':''}`;
    chatBodyEl.innerHTML=renderChatMessagesHtml(selected.character);
    chatBodyEl.scrollTop=chatBodyEl.scrollHeight;
    const bannerSlot=$('chat-paused-banner-slot');
    if(bannerSlot)bannerSlot.innerHTML=renderPausedTaskBanner();
    existingInput.placeholder=meeting?'写下你在见面时的动作、神态或台词……':'输入消息……';
    const sendBtn=layoutEl.querySelector('#chat-form .send');
    if(sendBtn)sendBtn.disabled=isBusy;
    const plusBtn=layoutEl.querySelector('#chat-form .chat-plus-btn');
    if(plusBtn){
      plusBtn.classList.toggle('active',Boolean(state.chatPlusOpen));
      plusBtn.setAttribute('aria-expanded',state.chatPlusOpen?'true':'false');
    }
    const plusPanel=$('chat-plus-panel');
    if(plusPanel)plusPanel.classList.toggle('open',Boolean(state.chatPlusOpen));
    updateQueueCountdown();
    return;
  }
  state.renderedThreadId=selected?state.threadId:'';
  $('view').innerHTML=state.threads.length?`<div class="messages-layout ${selected?'has-chat':''}"><div class="threads">${renderMessagesListItems()}</div><div class="chat-view ${state.chatMode==='meeting'?'meeting-mode':''}">${selected?renderChat(selected):'<div class="empty-state"><div class="empty-illustration">'+I('letter')+'</div><h2>选一段对话</h2><p>每次相遇都有延续的故事。</p></div>'}</div></div>`:empty('letter','还没有匹配对象','去发现页滑动卡片；右滑喜欢后，对方也有自己的选择。','去发现','discover');
  const body=$('chat-body');if(body)body.scrollTop=body.scrollHeight;
  updateQueueCountdown();
  const input=$('chat-input');
  if(input){
    const draft=state.draftInputs[state.threadId]||'';
    if(draft)input.value=draft;
    input.addEventListener('input',e=>{if(state.threadId){state.draftInputs[state.threadId]=e.target.value;state.lastSendAt=Date.now()}});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('chat-form').requestSubmit()}});
    $('chat-form').addEventListener('submit',sendMessage);
    if(wasFocused){
      input.focus();
      try{if(selStart!==null)input.setSelectionRange(selStart,selEnd)}catch{}
    }
  }
}

async function saveCharacterNickname(nickValue){
  const thread=state.threads.find(x=>x.character.id===state.threadId);
  if(!thread||!state.activeId)return;
  const clean=String(nickValue??'').trim().slice(0,36);
  try{
    const r=await api('/nickname',{profileId:state.activeId,characterId:thread.character.id,nickname:clean});

}

async function revealMultipleBubbles(replies,profileId,id){
  if(!Array.isArray(replies)||replies.length<=1){
    state.hiddenReplyIds.clear();
    state.revealingBubbles=false;
    if(state.activeId===profileId&&state.threadId===id&&state.tab==='messages')await loadThreads(id);
    else refreshInboxQuietly(profileId);
    return;
  }
  state.hiddenReplyIds=new Set(replies.slice(1).map(x=>x.id));
  state.revealingBubbles=true;
  if(state.activeId===profileId&&state.threadId===id&&state.tab==='messages')await loadThreads(id);
  for(const nextMsg of replies.slice(1)){
    const delayMs=Math.min(1400,Math.max(550,(nextMsg.text||'').length*38));
    await new Promise(res=>setTimeout(res,delayMs));
    state.hiddenReplyIds.delete(nextMsg.id);
    if(state.activeId===profileId&&state.threadId===id&&state.tab==='messages')renderMessages();
  }
  state.revealingBubbles=false;
  state.hiddenReplyIds.clear();
  if(state.activeId===profileId&&state.threadId===id&&state.tab==='messages')renderMessages();
  else refreshInboxQuietly(profileId);
}
async function flushChat(force=false){if(state.flushBusy||state.chatBusy||state.revealingBubbles||!state.threadId||state.chatMode!=='chat')return;
  state.flushBusy=true;const id=state.threadId,profileId=state.activeId;
  if(state.tab==='messages'&&state.threadId===id)renderMessages();
  try{
    const r=await api('/chat-flush',{profileId,characterId:id,force});
    state.flushBusy=false;
    if(r.apiError){
      if(r.queue)state.queue=r.queue;
      if(r.taskState)state.taskState=r.taskState;
      if(state.activeId===profileId&&state.threadId===id&&state.tab==='messages'){
        await loadThreads(id);
        showApiErrorModal(r.apiError,r.taskState,{type:'chat_flush',profileId,characterId:id,mode:'chat'});
      }else{
        await refreshInboxSnapshot(profileId);
      }
      return;
    }
    if(r.warning)toast(r.warning);
    if(r.replies&&r.replies.length>1){
      await revealMultipleBubbles(r.replies,profileId,id);
    }else if(state.activeId===profileId&&state.threadId===id&&state.tab==='messages'){
      await loadThreads(id);
    }else if(state.activeId===profileId){await refreshInboxSnapshot(profileId);}

async function pullModelIds(kind){
  const c=modelPickerConfig[kind],field=$(c.input),form=$('api-settings-form');
  if(!savedModelConnection(kind)){toast('请先保存'+(kind==='image'?'图片 ':'')+'API 地址和密钥，再拉取模型');return;}
  const seq=++modelPickerRequests[kind],url=state.settings[c.settingUrl];
  const btn=document.querySelector('[data-action="'+(kind==='image'?'fetch-image-models':'fetch-models')+'"]');
  if(btn)btn.disabled=true;
  try{
    const r=await api(c.route);
    if(seq!==modelPickerRequests[kind]||state.settings[c.settingUrl]!==url)return;
    const ids=normalizeModelIds(r.models);
    modelPickerCache[kind]={url,ids};
    modelPickerManual[kind]=false;
    if(state.tab!=='terminal'||state.terminalTab!=='api'||$('api-settings-form')!==form||!savedModelConnection(kind))return;
    syncModelPicker(kind);
    if(!ids.length){toast('接口没有返回模型列表，可手动输入模型 ID');return;}
    openModelPicker(kind);
  }catch(e){if(seq===modelPickerRequests[kind])toast(e.message);}
  finally{if(btn&&btn.isConnected)btn.disabled=false;}
}
function bindModelPickers(){
  for(const kind of ['chat','image']){
    const c=modelPickerConfig[kind],field=$(c.input);
    if(!field)continue;
    syncModelPicker(kind);
    field.addEventListener('keydown',e=>{if(field.readOnly&&['Enter',' ','ArrowDown'].includes(e.key)){e.preventDefault();openModelPicker(kind);}});
    for(const id of [c.url,c.key])$(id)?.addEventListener('input',()=>{syncModelPicker(kind);});
  }
}

async function retryFailedApiTask(){

// Fit the visible viewport while the iOS keyboard is open without disabling pinch zoom.
function syncVisibleViewport(){
  const vv=window.visualViewport;
  if(vv&&Math.abs(vv.scale-1)>0.01)return;
  const height=vv?.height||window.innerHeight;
  if(height>0)document.documentElement.style.setProperty('--parallel-visible-height',Math.round(height)+'px');
  document.documentElement.style.setProperty('--parallel-visible-top',Math.round(vv?.offsetTop||0)+'px');
}
window.addEventListener('resize',syncVisibleViewport,{passive:true});
window.visualViewport?.addEventListener('resize',syncVisibleViewport,{passive:true});
window.visualViewport?.addEventListener('scroll',syncVisibleViewport,{passive:true});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&state.activeId){
    if(state.tab==='messages')void loadThreads(state.threadId).catch(()=>{});
    else refreshInboxQuietly();
  }
});
syncVisibleViewport();
